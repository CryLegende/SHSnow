name: SHSnow
version: '${project.version}'
main: org.Cry_Legende.sHSnow.SHSnow
api-version: '1.21'
author: Cry_Legende
description: Chute de neige autour des joueurs dans les mondes choisis.

permissions:
  shsnow.toggle:
    description: Utiliser /snow pour activer ou couper la neige.
    default: true
  shsnow.admin:
    description: Toutes les sous-commandes de /shsnow.
    default: op
    children:
      shsnow.admin.reload: true
  shsnow.admin.reload:
    description: Utiliser /shsnow reload.
    default: op
